# Conda environment for the HLA imputation pipeline (hla_imputation/) and
# main_script.R.
#
#   conda env create -f environment.yml
#   conda activate r-hibag
#
# PLINK 1.9 and PLINK 2 are not part of this environment; see SOFTWARE.md.

name: r-hibag
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3.3
  - bioconductor-hibag=1.38.0
  - bioconductor-rtracklayer=1.62.0
  - bioconductor-genomicranges=1.54.1
  - r-data.table=1.17.8
  - r-tidyr=1.3.1
  - r-dplyr=1.1.4
  - r-stringr=1.5.2
  - r-readxl=1.4.5
  - r-ggplot2=3.5.2
  - r-corrplot=0.92
